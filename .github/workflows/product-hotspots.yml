name: Product hotspots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Rendu prioritaire à localiser"
        required: false
        type: string
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  push:
    branches: [main]

concurrency:
  group: product-hotspots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      AURIMMO_LAB_ROOT: ${{ github.workspace }}
      HOTSPOT_RUN_ID: ${{ github.event.inputs.run_id || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check for rendered images awaiting product points
        id: pending
        shell: bash
        run: echo "count=$(node scripts/hotspot-bridge.mjs --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/local-product-locator-ci.requirements.txt

      - name: Install offline vision runtime
        if: steps.pending.outputs.count != '0'
        run: |
          python -m venv .venv-vision
          .venv-vision/bin/pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          .venv-vision/bin/pip install --disable-pip-version-check -r scripts/local-product-locator-ci.requirements.txt

      - name: Restore pinned public model cache
        if: steps.pending.outputs.count != '0'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: data/local-vision
          key: local-product-locator-v1-${{ runner.os }}-a2bb814-70c1a07

      - name: Download pinned public model weights
        if: steps.pending.outputs.count != '0' && steps.model-cache.outputs.cache-hit != 'true'
        run: .venv-vision/bin/python scripts/setup-local-product-locator.py

      - name: Locate selected catalogue products on final pixels
        if: steps.pending.outputs.count != '0'
        run: node scripts/hotspot-bridge.mjs --once
